name: Behavioral Equivalence Verification

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify-windows:
    name: Windows Equivalence Verification
    runs-on: windows-latest
    if: github.repository == 'urgorri/halflife-refactored' || vars.ENABLE_BEHAVIORAL_EQUIVALENCE == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify gameplay constants (Layer 1)
        run: python tests/verify_constants.py --golden tests/golden/constants.json

      - name: Verify save/restore tables (Layer 2B)
        run: python tests/verify_saverestore.py --golden tests/golden/saverestore_baseline.json

      - name: Verify canonical upstream drift (Layer 5)
        run: python tests/verify_upstream_drift.py

      - name: Build Windows Client DLL
        run: >
          msbuild projects/vs2019/hl_cdll.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Build Windows Server DLL
        run: >
          msbuild projects/vs2019/hldll.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Verify exported symbol table (Layer 4)
        run: |
          python tests/verify_symbols.py --golden tests/golden/symbols_client_windows.txt --binary projects/vs2019/Release/hl_cdll/client.dll
          python tests/verify_symbols.py --golden tests/golden/symbols_server_windows.txt --binary projects/vs2019/Release/hldll/hl.dll

      - name: Build unit tests & compile-time layout checks (Layer 3 & 2A/2B)
        run: >
          msbuild projects/vs2019/hl_tests.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Copy runtime dependencies
        shell: pwsh
        run: |
          Copy-Item "lib/public/*.dll" "projects/vs2019/Release/hl_cdll/" -Force
          Copy-Item "lib/public/*.dll" "projects/vs2019/Release/hl_tests/" -Force

      - name: Run unit tests (Layer 3)
        run: projects/vs2019/Release/hl_tests/hl_tests.exe

      - name: Build smoke test runner
        run: >
          msbuild projects/vs2019/smoke_test_client.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Copy runtime dependencies to smoke test runner
        shell: pwsh
        run: |
          Copy-Item "lib/public/*.dll" "projects/vs2019/Release/smoke_test_client/" -Force

      - name: Run client DLL smoke test
        run: projects/vs2019/Release/smoke_test_client/smoke_test_client.exe projects/vs2019/Release/hl_cdll/client.dll

  verify-linux:
    name: Linux Equivalence Verification
    runs-on: ubuntu-24.04
    if: github.repository == 'urgorri/halflife-refactored' || vars.ENABLE_BEHAVIORAL_EQUIVALENCE == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/sources.list.d/ubuntu.sources || true
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15" -o Acquire::Retries="3" update && \
          sudo apt-get -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15" -o Acquire::Retries="3" install -y \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            make \
            python3

      - name: Verify gameplay constants (Layer 1)
        run: python3 tests/verify_constants.py --golden tests/golden/constants.json

      - name: Verify save/restore tables (Layer 2B)
        run: python3 tests/verify_saverestore.py --golden tests/golden/saverestore_baseline.json

      - name: Verify canonical upstream drift (Layer 5)
        run: python3 tests/verify_upstream_drift.py

      - name: Build Linux Client DLL
        working-directory: linux
        run: |
          make hl_cdll \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1

      - name: Build Linux Server DLL
        working-directory: linux
        run: |
          make hl \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1

      - name: Verify exported symbol table (Layer 4)
        run: |
          python3 tests/verify_symbols.py --golden tests/golden/symbols_client_linux.txt --binary linux/release/cl_dlls/client.so
          python3 tests/verify_symbols.py --golden tests/golden/symbols_server_linux.txt --binary linux/release/dlls/hl.so

      - name: Build unit tests & compile-time layout checks (Layer 3 & 2A/2B)
        working-directory: linux
        run: |
          make hl_tests \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1

      - name: Run unit tests (Layer 3)
        run: LD_LIBRARY_PATH="linux:linux/release/cl_dlls:$LD_LIBRARY_PATH" linux/release/hl_tests

      - name: Run client SO smoke test
        run: LD_LIBRARY_PATH="linux:linux/release/cl_dlls:$LD_LIBRARY_PATH" linux/release/smoke_test_client linux/release/cl_dlls/client.so
