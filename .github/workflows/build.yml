name: Build Half-Life DLLs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows x86 DLLs
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build Windows Client DLL
        run: >
          msbuild projects/vs2019/hl_cdll.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Build Windows Server DLL
        run: >
          msbuild projects/vs2019/hldll.vcxproj
          /p:Configuration=Release
          /p:Platform=Win32
          /m

      - name: Verify outputs
        shell: pwsh
        run: |
          $client = "projects/vs2019/Release/hl_cdll/client.dll"
          $server = "projects/vs2019/Release/hldll/hl.dll"
          if (-not (Test-Path $client)) {
            throw "Client DLL was not produced: $client"
          }
          if (-not (Test-Path $server)) {
            throw "Server DLL was not produced: $server"
          }

      - name: Build via CMake (Win32)
        run: |
          cmake -B build-cmake -A Win32
          cmake --build build-cmake --config Release

      - name: Verify CMake Windows outputs & run tests
        shell: pwsh
        run: |
          $client = "build-cmake/bin/Release/client.dll"
          $server = "build-cmake/bin/Release/hl.dll"
          $tests = "build-cmake/bin/Release/hl_tests.exe"
          $smoke = "build-cmake/bin/Release/smoke_test_client.exe"
          if (-not (Test-Path $client)) { throw "CMake Client DLL was not produced: $client" }
          if (-not (Test-Path $server)) { throw "CMake Server DLL was not produced: $server" }
          if (-not (Test-Path $tests)) { throw "CMake Test executable was not produced: $tests" }
          if (-not (Test-Path $smoke)) { throw "CMake Smoke test executable was not produced: $smoke" }
          Copy-Item "lib/public/*.dll" "projects/vs2019/Release/hl_cdll/" -Force
          & $tests
          & $smoke $client
          & $smoke "projects/vs2019/Release/hl_cdll/client.dll"

      - name: Prepare packaging
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "package/cl_dlls"
          New-Item -ItemType Directory -Force -Path "package/dlls"
          Copy-Item "projects/vs2019/Release/hl_cdll/client.dll" "package/cl_dlls/"
          Copy-Item "projects/vs2019/Release/hldll/hl.dll" "package/dlls/"

      - name: Upload Windows DLLs
        uses: actions/upload-artifact@v7
        with:
          name: halflife-windows
          path: package/

  build-linux:
    name: Linux x86 DLLs
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          # The Ubuntu 24.04 runner resolves its apt mirror through /etc/apt/apt-mirrors.txt
          # (observed in the job log as "Get:1 file:/etc/apt/apt-mirrors.txt Mirrorlist"), so
          # rewriting only the hostnames in sources.list* leaves the slow azure mirror in
          # effect and the install can exceed this step's timeout.
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/* /etc/apt/sources.list.d/ubuntu.sources || true
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/apt-mirrors.txt || true
          fi
          sudo dpkg --add-architecture i386
          sudo apt-get -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15" -o Acquire::Retries="3" update && \
          sudo apt-get -o Acquire::http::Timeout="15" -o Acquire::https::Timeout="15" -o Acquire::Retries="3" install -y \
            gcc \
            g++ \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            make \
            cmake

      - name: Build via CMake (Linux x86)
        run: |
          cmake -B build-cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cmake

      - name: Verify CMake Linux outputs & run tests
        run: |
          file build-cmake/bin/client.so
          file build-cmake/bin/client.so | grep -q "ELF 32-bit"
          file build-cmake/bin/hl.so
          file build-cmake/bin/hl.so | grep -q "ELF 32-bit"
          LD_LIBRARY_PATH="linux:linux/release/cl_dlls:build-cmake/bin:$LD_LIBRARY_PATH" ./build-cmake/bin/hl_tests
          LD_LIBRARY_PATH="linux:linux/release/cl_dlls:build-cmake/bin:$LD_LIBRARY_PATH" ./build-cmake/bin/smoke_test_client ./build-cmake/bin/client.so

      - name: Build Linux Client DLL
        working-directory: linux
        run: |
          make hl_cdll \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1
          LD_LIBRARY_PATH=".:release/cl_dlls:$LD_LIBRARY_PATH" ../build-cmake/bin/smoke_test_client release/cl_dlls/client.so

      - name: Build Linux Server DLL
        working-directory: linux
        run: |
          make hl \
            ARCH_CFLAGS_I486="-m32" \
            ARCH_CFLAGS_I686="-m32" \
            ARCH_CFLAGS_AMD="-m32" \
            ARCH_CFLAGS_AMD64="-m32" \
            HL_OUTPUT_DIR=release \
            CREATE_OUTPUT_DIRS=1

      - name: Verify architecture
        run: |
          file linux/release/cl_dlls/client.so
          file linux/release/cl_dlls/client.so | grep -q "ELF 32-bit"
          file linux/release/dlls/hl.so
          file linux/release/dlls/hl.so | grep -q "ELF 32-bit"

      - name: Prepare packaging
        run: |
          mkdir -p package/cl_dlls package/dlls
          cp linux/release/cl_dlls/client.so package/cl_dlls/
          cp linux/release/dlls/hl.so package/dlls/

      - name: Upload Linux DLLs
        uses: actions/upload-artifact@v7
        with:
           name: halflife-linux
           path: package/
